[package]
name = "silica-lab"
version = "0.1.0"
description = "Silica Lab IC IDE"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [
    "dialog-open",
    "shell-execute",
    "shell-open",
    "fs-all",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
verilog-compiler = { path = "../../silica-lab/crates/verilog_compiler" }
notify = "6.1"
